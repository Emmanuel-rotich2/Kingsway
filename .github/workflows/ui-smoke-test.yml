name: UI Smoke Tests

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out application
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, mbstring, openssl, curl, zip

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install browser dependency
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Validate JavaScript syntax
        run: |
          node --check js/api.js
          find js/pages js/core js/components -type f -name '*.js' -print0 \
            | xargs -0 -n1 node --check

      - name: Start isolated PHP server
        env:
          APP_ENV: development
          BASE_URL: http://127.0.0.1:8081
          JWT_SECRET: ci-only-public-ui-smoke-secret-value-not-used-outside-this-job-2026
        run: |
          printf 'APP_ENV=%s\nJWT_SECRET=%s\nTFA_ENCRYPTION_KEY=%s\nREALTIME_BUFFER_SECRET=%s\n' \
            "$APP_ENV" "$JWT_SECRET" \
            '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef' \
            'ci-only-realtime-buffer-secret-value-that-is-not-used-outside-this-job-2026' \
            > config/.env
          php -S 127.0.0.1:8081 -t . > /tmp/kingsway-php-server.log 2>&1 &
          echo $! > /tmp/kingsway-php-server.pid

      - name: Wait for application
        run: |
          ready=0
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail http://127.0.0.1:8081/index.php >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/kingsway-php-server.log
            exit 1
          fi

      - name: Run deterministic public UI smoke test
        env:
          BASE_URL: http://127.0.0.1:8081
        run: node .github/scripts/public-ui-smoke.js

      - name: Show server log after failure
        if: failure()
        run: cat /tmp/kingsway-php-server.log || true

      - name: Stop PHP server
        if: always()
        run: |
          if [ -f /tmp/kingsway-php-server.pid ]; then
            kill "$(cat /tmp/kingsway-php-server.pid)" 2>/dev/null || true
          fi

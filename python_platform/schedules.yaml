- name: queue_drain
  kind: http
  endpoint: /api/realtime/worker
  payload:
    limit: 30
  interval: 30
- name: outbox
  kind: http
  endpoint: /api/communications/process-outbox
  payload:
    limit: 25
  interval: 30
- name: staff_invitations
  kind: http
  endpoint: /api/staff-migration/process-invitation-email
  payload:
    limit: 25
  interval: 60
- name: attendance_reminders
  kind: http
  endpoint: /api/attendance/process-register-reminders
  secret_env: [ATTENDANCE_WORKER_SECRET]
  payload: {}
  interval: 60
- name: kcb_reconciliation
  kind: http
  endpoint: /api/finance/kcb-reconciliation-worker
  # Same fallback as PHP: its own secret, else COMMUNICATION_WORKER_SECRET.
  secret_env: [KCB_RECONCILIATION_WORKER_SECRET, COMMUNICATION_WORKER_SECRET]
  payload:
    limit: 25
  interval: 60
- name: stk_sweep
  kind: http
  endpoint: /api/payments/stk-sweep-worker
  # PHP checks PAYMENT_SWEEP_WORKER_SECRET, falling back to COMMUNICATION_WORKER_SECRET.
  secret_env: [PAYMENT_SWEEP_WORKER_SECRET, COMMUNICATION_WORKER_SECRET]
  payload:
    limit: 25
    stall_minutes: 30
  interval: 60
- name: sms_contact_sync
  kind: http
  endpoint: /api/communications/sync-sms-contacts
  secret_env: [COMMUNICATION_WORKER_SECRET]
  # Bounded so it finishes well inside the bridge's 90 s timeout (a provider
  # call may take 30 s); an unfinished run reports complete=false and the next
  # tick continues. Rejected contacts are retried after 6 h, not every run.
  payload:
    limit: 100
    max_seconds: 40
    retry_errors_after_minutes: 360
  interval: 120
- name: extra_charge_obligations
  kind: http
  endpoint: /api/finance/extra-charge-obligations-worker
  # Formerly the MariaDB event ev_generate_due_extra_charge_obligations (needed
  # event_scheduler=ON). Idempotent, so hourly is safe and catches up quickly.
  secret_env: [COMMUNICATION_WORKER_SECRET]
  payload: {}
  interval: 3600
- name: fee_rollover_sync
  kind: http
  endpoint: /api/finance/fee-rollover-sync-worker
  # Keeps balances brought forward into a new academic year equal to the
  # outgoing year's balance when that year changes after rollover (a late
  # payment, waiver or correction), so nobody is billed twice. Idempotent:
  # learners whose balance has not changed are not touched.
  secret_env: [COMMUNICATION_WORKER_SECRET]
  payload:
    limit: 500
  interval: 120
- name: realtime_cleanup
  kind: http
  endpoint: /api/realtime/cleanup
  payload: {}
  interval: 60
# Python-owned queue jobs, drained in-process by the ticker (formerly the
# per-minute cron call to POST /internal/worker {"mode":"queue"}).
- name: python_queue
  kind: python_queue
  payload:
    limit: 50
  interval: 60
- name: insight_brief_daily
  kind: http
  endpoint: /api/dashboard/insight-brief-queue
  payload:
    cadence: daily
  interval: 60
- name: insight_brief_weekly
  kind: http
  endpoint: /api/dashboard/insight-brief-queue
  payload:
    cadence: weekly
  interval: 60
- name: agent_digest
  kind: http
  endpoint: /api/dashboard/agent-digest-worker
  payload: {}
  interval: 60
# Soft year/term transition. Reconciles term statuses against the calendar and
# activates a certified target year on its start date, so the outgoing year
# stays operational until its last day. Idempotent: a missed tick just runs on
# the next one.
- name: academic_activation_sweep
  kind: http
  endpoint: /api/academic/activation-sweep
  secret_env: [KINGSWAY_WORKER_SECRET]
  payload: {}
  interval: 60
- name: kicd_policy_watch
  kind: http
  endpoint: /api/dashboard/kicd-policy-watch
  payload: {}
  interval: 60
